# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The C extension is not built here: docs/conf.py mocks the "qlsc.q3c" module so
# that autodoc can import the package without a compiler. Only the packages in
# docs/requirements.txt are installed.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
